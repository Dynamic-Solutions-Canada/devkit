name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    # Lint, format check and the unit suite take about a minute; the cap only stops a hung run.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Package VS Code browser bridge
        run: npm run build:browser-extension

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: devkit-browser
          path: vscode-extension/devkit-browser-*.vsix
          if-no-files-found: error
