name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    # Lint, format check and the unit suite take about a minute; the cap only stops a hung run.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      # The store hero render tests need devkit-store-hero's pinned fonts (about 27 MB); without
      # them they skip. The key changes whenever the pinned list does.
      - name: Cache the store hero fonts
        uses: actions/cache@v6
        with:
          path: ~/.cache/devkit/fonts
          key: devkit-fonts-${{ hashFiles('src/store-hero/fonts.mjs') }}

      - name: Fetch the store hero fonts
        run: node bin/devkit-store-hero.mjs --fetch-fonts

      - name: Validate
        run: npm run validate

      # The tracked .vsix is a documented exception to "no committed build output" (D-042);
      # this fails when a rebuild from source no longer matches it.
      - name: Check the tracked VS Code browser bridge
        run: npm run check:browser-extension

      - name: Package VS Code browser bridge
        run: npm run build:browser-extension

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: devkit-browser
          path: vscode-extension/devkit-browser-*.vsix
          if-no-files-found: error
